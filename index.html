<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banca Torinese - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <h2>Banca Torinese</h2>
        <p>Accesso Area Riservata</p>
        <form action="dashboard.html">
            <div class="input-group">
                <label for="username">Codice Utente</label>
                <input type="text" id="username" placeholder="Inserisci il tuo codice">
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Inserisci la password">
            </div>
            <button type="submit" class="btn-login">Accedi</button>
        </form>
    </div>
</body>
</html>
